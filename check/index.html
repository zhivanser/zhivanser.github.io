<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuthCheck - Проверка подлинности одежды и обуви</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            padding: 30px;
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #00d4ff, #7b2ff7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: #aaa;
            font-size: 1.1rem;
        }

        .step {
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .step-title {
            font-size: 1.3rem;
            margin-bottom: 20px;
            color: #00d4ff;
        }

        .options {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .option-btn {
            flex: 1;
            min-width: 150px;
            padding: 15px 25px;
            border: 2px solid rgba(255,255,255,0.2);
            background: transparent;
            color: #fff;
            font-size: 1rem;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .option-btn:hover {
            border-color: #00d4ff;
            background: rgba(0,212,255,0.1);
        }

        .option-btn.active {
            border-color: #7b2ff7;
            background: rgba(123,47,247,0.2);
        }

        .brands-container {
            display: none;
            margin-top: 15px;
        }

        .brands-container.visible {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .brand-btn {
            padding: 10px 20px;
            border: 1px solid rgba(255,255,255,0.3);
            background: rgba(255,255,255,0.05);
            color: #fff;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .brand-btn:hover {
            background: rgba(0,212,255,0.2);
        }

        .brand-btn.active {
            background: linear-gradient(90deg, #00d4ff, #7b2ff7);
            border-color: transparent;
        }

        .upload-section {
            text-align: center;
            padding: 40px;
            border: 2px dashed rgba(255,255,255,0.3);
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
        }

        .upload-section:hover {
            border-color: #00d4ff;
            background: rgba(0,212,255,0.05);
        }

        .upload-section.dragover {
            border-color: #7b2ff7;
            background: rgba(123,47,247,0.1);
        }

        .upload-icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }

        .upload-text {
            color: #aaa;
        }

        #fileInput {
            display: none;
        }

        .preview-container {
            display: none;
            margin-top: 20px;
            text-align: center;
        }

        .preview-container.visible {
            display: block;
        }

        .preview-image {
            max-width: 300px;
            max-height: 300px;
            border-radius: 10px;
            border: 3px solid #7b2ff7;
        }

        .check-btn {
            display: none;
            width: 100%;
            padding: 20px;
            margin-top: 20px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background: linear-gradient(90deg, #00d4ff, #7b2ff7);
            color: #fff;
            transition: transform 0.3s ease;
        }

        .check-btn.visible {
            display: block;
        }

        .check-btn:hover {
            transform: scale(1.02);
        }

        .result {
            display: none;
            margin-top: 30px;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
        }

        .result.visible {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result.original {
            background: linear-gradient(135deg, #00c853, #00e676);
            color: #fff;
        }

        .result.fake {
            background: linear-gradient(135deg, #ff5252, #ff1744);
            color: #fff;
        }

        .result-icon {
            font-size: 4rem;
            margin-bottom: 15px;
        }

        .result-title {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .result-desc {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 40px;
        }

        .loading.visible {
            display: block;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top-color: #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error {
            display: none;
            padding: 20px;
            background: rgba(255,82,82,0.2);
            border: 1px solid #ff5252;
            border-radius: 10px;
            color: #ff5252;
            margin-top: 20px;
        }

        .error.visible {
            display: block;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 1.8rem;
            }
            
            .option-btn {
                min-width: 100%;
            }
            
            .step {
                padding: 20px;
            }
            
            header {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔍 AuthCheck</h1>
            <p class="subtitle">Проверка подлинности одежды и обуви</p>
        </header>

        <div class="step">
            <div class="step-title">Шаг 1: Выберите тип одежды</div>
            <div class="options">
                <button class="option-btn" data-type="upper">👕 Верхняя одежда</button>
                <button class="option-btn" data-type="shoes">👟 Обувь</button>
            </div>
            <div id="upperBrands" class="brands-container">
                <button class="brand-btn" data-brand="nike">Nike</button>
                <button class="brand-btn" data-brand="adidas">Adidas</button>
            </div>
            <div id="shoesBrands" class="brands-container">
                <button class="brand-btn" data-brand="nike">Nike</button>
                <button class="brand-btn" data-brand="adidas">Adidas</button>
                <button class="brand-btn" data-brand="puma">Puma</button>
                <button class="brand-btn" data-brand="reebok">Reebok</button>
                <button class="brand-btn" data-brand="newbalance">New Balance</button>
            </div>
        </div>

        <div class="step">
            <div class="step-title">Шаг 2: Загрузите фото</div>
            <div class="upload-section" id="uploadSection">
                <div class="upload-icon">📸</div>
                <div class="upload-text">Нажмите или перетащите фото сюда</div>
            </div>
            <input type="file" id="fileInput" accept="image/*">
            <div class="preview-container" id="previewContainer">
                <img id="previewImage" class="preview-image" alt="Preview">
            </div>
        </div>

        <button class="check-btn" id="checkBtn">🔍 Проверить подлинность</button>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <div>Анализируем изображение...</div>
        </div>

        <div class="error" id="error"></div>

        <div class="result" id="result">
            <div class="result-icon" id="resultIcon"></div>
            <div class="result-title" id="resultTitle"></div>
            <div class="result-desc" id="resultDesc"></div>
        </div>
    </div>

        let selectedType = null;
        let selectedBrand = null;
        let uploadedImageData = null;

        const optionBtns = document.querySelectorAll('.option-btn');
        const brandBtns = document.querySelectorAll('.brand-btn');
        const uploadSection = document.getElementById('uploadSection');
        const fileInput = document.getElementById('fileInput');
        const previewContainer = document.getElementById('previewContainer');
        const previewImage = document.getElementById('previewImage');
        const checkBtn = document.getElementById('checkBtn');
        const loading = document.getElementById('loading');
        const result = document.getElementById('result');
        const error = document.getElementById('error');

        optionBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                optionBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedType = btn.dataset.type;

                document.getElementById('upperBrands').classList.remove('visible');
                document.getElementById('shoesBrands').classList.remove('visible');
                brandBtns.forEach(b => b.classList.remove('active'));
                selectedBrand = null;

                if (selectedType === 'upper') {
                    document.getElementById('upperBrands').classList.add('visible');
                } else if (selectedType === 'shoes') {
                    document.getElementById('shoesBrands').classList.add('visible');
                }

                checkResultState();
            });
        });

        brandBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                brandBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedBrand = btn.dataset.brand;
                checkResultState();
            });
        });

        uploadSection.addEventListener('click', () => fileInput.click());
        
        uploadSection.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadSection.classList.add('dragover');
        });

        uploadSection.addEventListener('dragleave', () => {
            uploadSection.classList.remove('dragover');
        });

        uploadSection.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadSection.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        function handleFile(file) {
            if (!file.type.startsWith('image/')) {
                showError('Пожалуйста, загрузите изображение');
                return;
            }

            const reader = new FileReader();
            reader.onload = (e) => {
                uploadedImageData = e.target.result;
                previewImage.src = uploadedImageData;
                previewContainer.classList.add('visible');
                error.classList.remove('visible');
                checkResultState();
            };
            reader.readAsDataURL(file);
        }

        function checkResultState() {
            if (selectedType && selectedBrand && uploadedImageData) {
                checkBtn.classList.add('visible');
            } else {
                checkBtn.classList.remove('visible');
            }
        }

        function showError(message) {
            error.textContent = message;
            error.classList.add('visible');
            result.classList.remove('visible');
        }

        async function getImageHash(imgSrc) {
            return new Promise((resolve) => {
                const img = new Image();
                img.crossOrigin = 'anonymous';
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    const size = 100;
                    canvas.width = size;
                    canvas.height = size;
                    ctx.drawImage(img, 0, 0, size, size);
                    const imageData = ctx.getImageData(0, 0, size, size);
                    const data = imageData.data;
                    
                    let hash = '';
                    for (let i = 0; i < data.length; i += 4) {
                        const gray = Math.round((data[i] + data[i+1] + data[i+2]) / 3);
                        hash += gray > 127 ? '1' : '0';
                    }
                    resolve(hash);
                };
                img.onerror = () => resolve(null);
                img.src = imgSrc;
            });
        }

        function hammingDistance(hash1, hash2) {
            let distance = 0;
            for (let i = 0; i < hash1.length; i++) {
                if (hash1[i] !== hash2[i]) distance++;
            }
            return distance;
        }

        async function loadReferenceImage(path) {
            return new Promise((resolve) => {
                const img = new Image();
                img.crossOrigin = 'anonymous';
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    const size = 100;
                    canvas.width = size;
                    canvas.height = size;
                    ctx.drawImage(img, 0, 0, size, size);
                    const imageData = ctx.getImageData(0, 0, size, size);
                    const data = imageData.data;
                    
                    let hash = '';
                    for (let i = 0; i < data.length; i += 4) {
                        const gray = Math.round((data[i] + data[i+1] + data[i+2]) / 3);
                        hash += gray > 127 ? '1' : '0';
                    }
                    resolve(hash);
                };
                img.onerror = () => resolve(null);
                img.src = path;
            });
        }

        checkBtn.addEventListener('click', async () => {
            loading.classList.add('visible');
            result.classList.remove('visible');
            error.classList.remove('visible');

            try {
                if (!referenceImages[selectedBrand] || !referenceImages[selectedBrand][selectedType === 'shoes' ? 'shoes' : 'upper']) {
                    showError('Для выбранной категории и бренда пока нет данных. Проверьте позже!');
                    loading.classList.remove('visible');
                    return;
                }

                const uploadedHash = await getImageHash(uploadedImageData);
                
                if (!uploadedHash) {
                    showError('Не удалось обработать загруженное изображение');
                    loading.classList.remove('visible');
                    return;
                }

                const originals = referenceImages[selectedBrand][selectedType === 'shoes' ? 'shoes' : 'upper'];
                
                const originalPath = originals.original;
                const fakePath = originals.fake;

                const originalHash = await loadReferenceImage(originalPath);
                const fakeHash = await loadReferenceImage(fakePath);

                if (!originalHash || !fakeHash) {
                    showError('Ошибка загрузки эталонных изображений');
                    loading.classList.remove('visible');
                    return;
                }

                const distOriginal = hammingDistance(uploadedHash, originalHash);
                const distFake = hammingDistance(uploadedHash, fakeHash);

                loading.classList.remove('visible');

                if (distOriginal < distFake) {
                    result.className = 'result visible original';
                    document.getElementById('resultIcon').textContent = '✅';
                    document.getElementById('resultTitle').textContent = 'ОРИГИНАЛ';
                    document.getElementById('resultDesc').textContent = 'Этот товар является подлинным!';
                } else {
                    result.className = 'result visible fake';
                    document.getElementById('resultIcon').textContent = '❌';
                    document.getElementById('resultTitle').textContent = 'ПОДДЕЛКА';
                    document.getElementById('resultDesc').textContent = 'Этот товар является контрафактным!';
                }

            } catch (err) {
                showError('Произошла ошибка при проверке: ' + err.message);
                loading.classList.remove('visible');
            }
        });
    </script>
